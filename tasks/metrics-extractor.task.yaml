task:
  id: metrics-extractor
  plan: baseline
  title: Parse evaluation logs into a stable metrics.json with the tolerance gate
  depends_on:
  - primary7-runner
  brief: |
    Write a stdlib-only Python 3 program: src/baseline/extract_metrics.py
    plus its tests. It reads the run manifest, parses each task's evaluation
    log, and writes one JSON metrics file. It runs no models and imports no
    third-party package.

    WHY STDLIB ONLY: this program is executed by the harness under
    ${HARNESS_PYTHON}, which is /usr/bin/python3 (Python 3.10.12) — a bare
    interpreter with NO torch, NO numpy, NO yaml. Importing any of them
    fails at acceptance time.

    CLI
      python3 src/baseline/extract_metrics.py \
        --manifest <path> --out <path> [--reference 0.6265] [--tolerance 0.005]
    --manifest and --out are required. Log paths inside the manifest are
    relative to the current working directory (the repository root).

    THE LOG FORMAT YOU MUST PARSE
    Each task log ends with a summary block. Here are four real, verbatim
    lines from logs/official50/cptac_luad_KRAS_mutation_ensemble_8branch_primary7.log
    (truncated in the middle of the per-fold list only):

      === PathoBench official 50-fold — cptac_luad/KRAS_mutation — 312 slides (folds 1..50) ===
      per-fold AUROC: 0.7786 0.6949 0.7203 0.6786 0.7988 ... 0.7915 0.8193 0.7642 0.5044
      fold-mean AUROC: 0.7340 ± 0.0944   pooled AUROC: 0.7270
      Saved official-fold predictions to /home/kimds/ICF/predictions/pathobench_cptac_luad_KRAS_mutation_ensemble_8branch_primary7_official50_bf16.pt

    Notes that WILL bite you if ignored:
    - The separator in "0.7340 ± 0.0944" is U+00B1 (±), not "+/-". The logs
      are UTF-8 but can contain stray bytes from progress output, so open
      them with encoding="utf-8", errors="replace".
    - The em dashes in the "===" header line are U+2014.
    - The spacing between "± 0.0944" and "pooled" is multiple spaces. Match
      with a tolerant regex (\s+), not a fixed number of spaces.
    - A log may contain MANY interleaved lines; the summary block is at the
      end. If a pattern somehow matches more than once, take the LAST match.
    - The per-fold line has exactly 50 space-separated floats.

    WHAT TO EXTRACT PER TASK
      fold_mean_auroc   float from "fold-mean AUROC: <X> ±"
      fold_std          float after the ±
      pooled_auroc      float from "pooled AUROC: <X>"
      per_fold_auroc    the list of 50 floats from the "per-fold AUROC:" line
      n_folds           len(per_fold_auroc)

    FAIL LOUDLY (exit code 1, message to stderr naming the task and path) if:
      - the manifest does not list exactly 7 tasks
      - a log file named in the manifest does not exist
      - a log has no "fold-mean AUROC:" line (this is what a crashed or OOM
        evaluation looks like — it must never be silently averaged away)
      - n_folds != 50
    Never substitute a default, a NaN, or skip a task.

    ARITHMETIC — follow this order exactly so the output is reproducible:
      1. round each task's fold_mean_auroc to 6 decimals
      2. macro_fold_mean_auroc = round(sum(those rounded values) / 7, 6)
      3. abs_delta_vs_reference = round(abs(macro_fold_mean_auroc - reference), 6)
      4. within_tolerance = 1 if abs_delta_vs_reference <= tolerance else 0
    Round pooled_auroc, fold_std and every per-fold value to 6 decimals too.

    OUTPUT JSON (exact shape; task keys keep their slash)
    {
      "tag": "<manifest tag>",
      "arm": "<manifest arm>",
      "tasks": {
        "cptac_lscc/ARID1A_mutation": {
          "fold_mean_auroc": 0.61,
          "fold_std": 0.09,
          "pooled_auroc": 0.6,
          "n_folds": 50,
          "per_fold_auroc": [ ... 50 floats ... ],
          "log": "logs/official50/..."
        },
        ... all 7 ...
      },
      "primary7": {
        "n_tasks": 7,
        "macro_fold_mean_auroc": 0.63,
        "reference_macro_fold_mean_auroc": 0.6265,
        "tolerance": 0.005,
        "abs_delta_vs_reference": 0.0035,
        "within_tolerance": 1
      }
    }
    Write it with json.dump(..., sort_keys=True, indent=2) plus a trailing
    newline. within_tolerance, n_tasks and n_folds must be Python ints, NOT
    booleans — the harness's json_metric check rejects bool as non-numeric.
    Create the --out parent directory if it does not exist.

    Also print a plain-text table to stdout: one line per task
    "<task> <fold_mean_auroc>", then a final line
    "MACRO <macro> DELTA <abs_delta> TOLERANCE <tolerance> WITHIN <0|1>".

    DELIVERABLE: tests/baseline/fixtures/sample_task_log.txt
    Create this file containing a REALISTIC task log tail: at minimum the
    four verbatim lines quoted above, with a full 50-value per-fold list
    (make up plausible values, but the count must be 50 and the fold-mean
    line must be internally consistent with the task you name). Keep the ±
    and — characters as real UTF-8. It must NOT be named *.log — the
    repository .gitignore excludes *.log and the fixture must be committed.

    DELIVERABLE: tests/baseline/test_extract_metrics.py
    A unittest module (runnable via `python3 -m unittest`) that, using only
    tempfile + the stdlib, covers at least:
      1. parsing tests/baseline/fixtures/sample_task_log.txt yields the
         fold-mean, std, pooled and 50 per-fold values in that file;
      2. a 7-task manifest whose logs have fold-means
         0.60 0.61 0.62 0.63 0.64 0.65 0.66 produces
         macro_fold_mean_auroc == 0.63, abs_delta_vs_reference == 0.0035,
         within_tolerance == 1;
      3. a 7-task manifest whose logs all have fold-mean 0.70 produces
         macro_fold_mean_auroc == 0.7, abs_delta_vs_reference == 0.0735,
         within_tolerance == 0;
      4. a manifest naming a missing log exits non-zero;
      5. a log with no "fold-mean AUROC:" line exits non-zero;
      6. a log whose per-fold line has 49 values exits non-zero;
      7. running the extractor twice on the same input produces
         byte-identical output files.
    Tests must not require a GPU, a network, or any file outside the repo.
  contract:
    inputs:
    - name: manifest
      type: json-file
      description: |
        The manifest emitted by scripts/baseline/run_primary7_v120.sh, listing 7 tasks each with a `task` name and a `log` path.
    - name: eval_logs
      type: log-files
      description: The per-task evaluation logs the manifest points at.
    outputs:
    - name: metrics
      type: json-file
      description: |
        Per-task fold-mean AUROC, the Primary 7 macro, the absolute delta against the recorded 0.6265, and an integer pass flag.
  deliverables:
  - src/baseline/extract_metrics.py
  - tests/baseline/test_extract_metrics.py
  - tests/baseline/fixtures/sample_task_log.txt
  constraints:
  - Python 3.10 standard library only. No torch, numpy, yaml, pandas, pytest, or any
    third-party import — in the program or the tests.
  - Do not modify any existing file in the repository; create only the three declared
    deliverables and their parent directories.
  - Do not read the model, the .pt prediction files, or any evaluation log outside
    the manifest. Logs are the only source of truth here.
  - 'Deterministic: byte-identical output for identical input. Sorted keys, fixed
    6-decimal rounding, no timestamps or absolute paths in the JSON.'
  - Never invent, default, or interpolate a missing metric — a missing or malformed
    log is a hard error.
  acceptance:
    steps:
    - id: extractor-stdlib-only
      run: |
        set -euo pipefail
        if grep -nE '^\s*(import|from)\s+(torch|numpy|np|pandas|yaml|scipy|sklearn|lightning|pytest)\b' src/baseline/extract_metrics.py tests/baseline/test_extract_metrics.py; then
          echo "FAIL: third-party import found; ${HARNESS_PYTHON} is a bare interpreter" >&2
          exit 1
        fi
        echo "stdlib-only ok"
    - id: extractor-unit-tests
      run: ${HARNESS_PYTHON} -m unittest discover -s tests/baseline -p "test_*.py"
        -v
    - id: extractor-golden-pass
      run: |
        set -euo pipefail
        rm -rf results/acceptance/extractor
        mkdir -p results/acceptance/extractor/logs
        ${HARNESS_PYTHON} - <<'PY'
        import json, os
        base = "results/acceptance/extractor"
        tasks = ["cptac_lscc/ARID1A_mutation","cptac_lscc/Histologic_Grade",
                 "cptac_lscc/KEAP1_mutation","cptac_luad/KRAS_mutation",
                 "cptac_pda/SMAD4_mutation","ucla_lung/progression_regression",
                 "cptac_ccrcc/PBRM1_mutation"]
        means = [0.60,0.61,0.62,0.63,0.64,0.65,0.66]
        entries = []
        for task, mean in zip(tasks, means):
            name = task.replace("/", "_")
            log = f"{base}/logs/{name}.log"
            folds = " ".join(f"{mean:.4f}" for _ in range(50))
            with open(log, "w", encoding="utf-8") as fh:
                fh.write(f"=== PathoBench official 50-fold — {task} — 312 slides (folds 1..50) ===\n")
                fh.write(f"per-fold AUROC: {folds}\n")
                fh.write(f"fold-mean AUROC: {mean:.4f} ± 0.0900   pooled AUROC: {mean:.4f}\n")
            entries.append({"task": task, "gpu": 0, "log": log,
                            "predictions": f"predictions/pathobench_{name}_golden_official50_bf16.pt"})
        with open(f"{base}/manifest.json", "w", encoding="utf-8") as fh:
            json.dump({"tag": "golden", "arm": "v120", "gpus": [0], "tasks": entries}, fh, indent=2)
        PY
        ${HARNESS_PYTHON} src/baseline/extract_metrics.py \
          --manifest results/acceptance/extractor/manifest.json \
          --out results/acceptance/extractor/metrics.json
      checks:
      - type: file_exists
        path: results/acceptance/extractor/metrics.json
      - type: json_metric
        path: results/acceptance/extractor/metrics.json
        metric: primary7.macro_fold_mean_auroc
        equals: 0.63
      - type: json_metric
        path: results/acceptance/extractor/metrics.json
        metric: primary7.abs_delta_vs_reference
        equals: 0.0035
      - type: json_metric
        path: results/acceptance/extractor/metrics.json
        metric: primary7.within_tolerance
        equals: 1
      - type: json_metric
        path: results/acceptance/extractor/metrics.json
        metric: primary7.n_tasks
        equals: 7
      - type: json_metric
        path: results/acceptance/extractor/metrics.json
        metric: tasks.cptac_pda/SMAD4_mutation.fold_mean_auroc
        equals: 0.64
      - type: json_metric
        path: results/acceptance/extractor/metrics.json
        metric: tasks.cptac_ccrcc/PBRM1_mutation.n_folds
        equals: 50
    - id: extractor-rejects-broken-log
      run: |
        set -euo pipefail
        mkdir -p results/acceptance/extractor_bad
        ${HARNESS_PYTHON} - <<'PY'
        import json
        base = "results/acceptance/extractor_bad"
        tasks = ["cptac_lscc/ARID1A_mutation","cptac_lscc/Histologic_Grade",
                 "cptac_lscc/KEAP1_mutation","cptac_luad/KRAS_mutation",
                 "cptac_pda/SMAD4_mutation","ucla_lung/progression_regression",
                 "cptac_ccrcc/PBRM1_mutation"]
        entries = []
        for i, task in enumerate(tasks):
            name = task.replace("/", "_")
            log = f"{base}/{name}.log"
            with open(log, "w", encoding="utf-8") as fh:
                if i == 4:
                    fh.write("CUDA out of memory. Tried to allocate 2.00 GiB\n")
                else:
                    folds = " ".join("0.6300" for _ in range(50))
                    fh.write(f"per-fold AUROC: {folds}\n")
                    fh.write("fold-mean AUROC: 0.6300 ± 0.0900   pooled AUROC: 0.6300\n")
            entries.append({"task": task, "gpu": 0, "log": log, "predictions": "x.pt"})
        with open(f"{base}/manifest.json", "w", encoding="utf-8") as fh:
            json.dump({"tag": "bad", "arm": "v120", "gpus": [0], "tasks": entries}, fh, indent=2)
        PY
        if ${HARNESS_PYTHON} src/baseline/extract_metrics.py \
             --manifest results/acceptance/extractor_bad/manifest.json \
             --out results/acceptance/extractor_bad/metrics.json; then
          echo "FAIL: extractor accepted a crashed (OOM) evaluation log" >&2
          exit 1
        fi
        echo "correctly rejected a crashed evaluation log"
    - id: extractor-deterministic
      run: |
        set -euo pipefail
        ${HARNESS_PYTHON} src/baseline/extract_metrics.py \
          --manifest results/acceptance/extractor/manifest.json \
          --out results/acceptance/extractor/metrics_b.json
        cmp results/acceptance/extractor/metrics.json results/acceptance/extractor/metrics_b.json
        echo "byte-identical across runs"
  status: done
  worker: worker
  log:
  - '2026-08-29T09:05:39Z worker worker [antigravity gemini-3.7-flash high] attempt
    1/6: acceptance passed'
  - 2026-08-29T09:05:39Z acceptance passed on attempt 1 — done
