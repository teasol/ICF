# v103: v98 baseline with the GELU hidden layer put back in the relation head.
#
# Question (docs SS131-3, list item #2). The head question was decided on
# evidence that does not survive re-examination. v83 replaced v82's
# 12->32->1 GELU head with a bare Linear(12,1) on a seed-paired delta of +0.0045,
# t = 1.15 -- p = 0.33 at df=3 -- and was promoted anyway as an explicit user
# call (SS108, SS109). SS131-2 then measured what four seeds can actually resolve:
# with paired SD around 0.005 the minimum detectable effect is 0.0121, so
# +0.0045 was never distinguishable from zero. v82 and v83 have never been told
# apart.
#
# That mattered less while v83 was the baseline. It matters now, because the
# baseline moved to v98 (SS131) and v98 inherits v83's linear head -- so the
# head choice is baked into the reference point on evidence of p = 0.33.
#
# v103 is v98 with ONE knob changed back:
#
#   ct_head_hidden_dims  []  ->  [32]      head Linear(12,1) -> 12->32->1 (GELU)
#   trainable            196,621 -> 197,057   (P 196,608 + head 13 -> 449)
#
# Everything else is v98: donor_shift_scale 0.15, Medium ClassSep, orthogonal
# manifold, no spectral tail. So this is a clean head-only test on the CURRENT
# baseline rather than a re-run of the old v82/v83 pair.
#
# ⚠️ Judged against v98's OWN seeds, not against v83 and not against v98's 8-seed
# mean. Absolute levels swing ~0.01 between seed groups (v98 A 0.6901 / B 0.6803),
# which is exactly why the protocol is seed-paired (SS131-1). Four seeds here pair
# against v98_p1_reverse_seed4{2..5}_ep49:
#
#   v98 seed42 0.6907 | seed43 0.6950 | seed44 0.6802 | seed45 0.6946
#
# ⚠️ Four seeds resolve only >= 0.0121 (SS131-2). If this comes back inside that
# band the honest verdict is "not measurable", NOT "no effect" -- and the follow-up
# is more seeds on this specific question, since it decides a structural property
# of the baseline rather than a data knob.
#
# Judged per docs SS107-3 (gate) and SS118 (final call is the user's). Report per
# SS118-3: what the arm tests, then all ten tasks beside baseline, then macro
# delta + t.
