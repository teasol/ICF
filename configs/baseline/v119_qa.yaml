name: v119_qa
description: "5-Branch Soft Voting with QA (CV + CT + BM + BD + QA)"
version: "119"

basis:
  sketch_dim: 256
  ridge_lambda: 1.0
  ridge_scale: 2.0

branches:
  cv:
    weight: 1.0
    blocks: offdiag

  bm:
    weight: 1.0
    dim: 32
    lambda: 1.0

  bd:
    weight: 1.0
    dim: 256
    metric: entropy
    readout: ordered_typicality
    lambda: 1.0
    separation_floor: 1.0
    eps: 1e-6

  qa:
    weight: 1.0
    dim: 32
    quantiles: [0.05, 0.10, 0.90, 0.95]
    lambda: 1.0

  ds:
    weight: 0.0

  ct:
    weight: 1.0
    pca_dim: 32
    tokens: 256
    tokenizer: hierarchical_2means
    readout: ridge
    temperature: 0.5
    eps: 1e-6

  dd:
    weight: 0.0

aggregation:
  method: soft_voting
