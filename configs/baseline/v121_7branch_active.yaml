name: v121_7branch_active
description: "7-Branch Official Baseline (CV + BM + BD + QA + DS + SH + SJ, CT/DD off, Trimmed Mean) -- D-042"
version: "121-7branch"

# 1. Basis & Projection
basis:
  sketch_dim: 256
  ridge_lambda: 1.0
  ridge_scale: 2.0

# 2. Branches
branches:
  cv:
    weight: 1.0
    blocks: offdiag

  bm:
    weight: 1.0
    dim: 32
    lambda: 1.0

  bd:
    weight: 1.0
    dim: 256
    metric: entropy
    readout: ordered_typicality
    lambda: 1.0
    separation_floor: 1.0
    eps: 1e-6

  qa:
    weight: 1.0
    dim: 32
    quantiles: [0.05, 0.10, 0.90, 0.95]
    lambda: 1.0

  ds:
    weight: 1.0
    dim: 32
    tokens: 256
    temperature: 1.0
    lambda: 1.0

  # Shape-family branches (D-042): SH (per-dimension skewness + excess
  # kurtosis) and SJ (joint shape of the whitened radius distribution),
  # promoted into the official comparison basis alongside CV/BM/BD/QA/DS.
  sh:
    weight: 1.0
    dim: 32
    wide: 256
    lambda: 1.0

  sj:
    weight: 1.0
    dim: 32
    lambda: 1.0

  ct:
    weight: 0.0
    pca_dim: 32
    tokens: 256
    tokenizer: hierarchical_2means
    readout: ridge
    temperature: 0.5
    eps: 1e-6

  dd:
    weight: 0.0
    shrinkage: 0.25
    eps: 1e-6
    readout: ordered_typicality
    separation_floor: 1.0

# 3. Head Aggregation
aggregation:
  method: trimmed_mean
  loo_gamma: 2.0
  loo_floor: 0.50
