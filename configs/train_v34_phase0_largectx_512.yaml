# v34 Phase 0 arm D — large-context training, 512-d input (Exp 1).
#
# Inherits the config-group defaults (data/model/optimizer/scheduler/trainer/
# logger/callbacks = default, i.e. v34-1536 values) and overrides only what
# distinguishes arm D: 512-d input (PathoBench 1536->512 PCA bridge) plus the
# large-context recipe (episode_batch_size 1, num_cells [1,32768],
# episodes_per_epoch 256, max_epochs 25).
#
# Gap: v30 trains on bags with num_cells ~ LogUniform[1,1024] (median ~34),
# while PathoBench bags (slides) hold 3k-30k+ tiles and all-context episodes
# total ~1.8M cells. This arm widens the cell-count range to PathoBench scale
# so the model actually learns large contexts.
#
# Scratch (no ckpt_path). B2 (per-episode cardinality, all bags share n_b) —
# same episode structure as v30, only the cell range widens. num_bags stays
# 60-100.
#
# Memory note: the dense aggregator materializes a [bags, cells, slots, dim]
# difference tensor, so episode_batch_size must be 1 and the cell upper bound
# is capped: 100 x 16384 x 12 x 512 x 4 = 40 GiB worst-case single episode
# (comfortable on B200). Fixes the latent _forward_dense empty/broadcast tail
# bug needed for the batch-1 dense path.
#
# Eval: PathoBench all-context with the existing 1536->512 PCA bridge
# (test_pathobench.py --config <this>, model input_dim = 512).
#
# MLA-slot: low-rank cell->slot affinity (d_c=64) + exact variance-based
# slot_std/slot_distance so the [cells, slots, dim] difference tensor is not
# materialized — this is what makes large contexts trainable in memory.
# Measured peak VRAM with slot_latent_dim=64: ~24 GiB at [1,16384]; ~2.3x for
# the [1,32768] worst case (~55 GiB) — fits B200 180 GiB.

seed: 42
ckpt_path:

data: default
data_overrides:
  episode_batch_size: 1
  dataset_kwargs:
    episodes_per_epoch: 256
    num_cells: [1, 32768]
    output_dim: 512

model: default
model_overrides:
  input_dim: 512

optimizer: default
scheduler: default

trainer: default
trainer_overrides:
  max_epochs: 25

logger: default
logger_overrides:
  experiment_name: v34_phase0_largectx_512

callbacks: default

model_kwargs:
  training_targets_per_episode: [5, 12]
  ranking_loss_weight: 0.10
  routing_sparsity_weight: 0.0
  routing_balance_weight: 0.0
