# v38 ridge ablation — G-2 removed (meta_enable_global_ridge: false)
#
# docs/current_status.md §65.
#
# HYPOTHESIS: the closed-form ridge solves take too much of the label signal,
# so the learned branches never get the gradient to develop. Each arm removes
# exactly ONE ridge and leaves that branch's learned residual in place:
#   global_shape branch keeps its set/cross-attention residual (G-3).
#
# SINGLE-FACTOR: this config differs from the control in that one flag only.
#
#   CONTROL = configs/train_v36_q1_baseline_1536.yaml  (already trained and
#   evaluated: 50 epochs, rare-free, projected, seed 42, identical data —
#   ckpt checkpoints/20260808_144323/v36_q1_baseline/epoch=049-val_ce_loss=0.3402.ckpt,
#   er_status 50-fold macro 0.7007 ± 0.087 / pooled 0.6953). Do NOT train a new
#   control; a second control run would differ only by nondeterminism.
#
#   arms: train_v38_ridge_ablation_no_global_1536.yaml      (G-2)
#         train_v38_ridge_ablation_no_abundance_1536.yaml   (P-2)
#         train_v38_ridge_ablation_no_covariance_1536.yaml  (CV-1)
#
# ⚠️ EVALUATE THIS ARM WITH THIS CONFIG. The ablated ridge parameters receive no
# gradient and stay at initialization (pinned by
# tests/test_ridge_ablation.py::test_ablated_ridge_parameters_get_no_gradient),
# so scoring this checkpoint with the ridge re-enabled injects an untrained
# branch. The same applies to rare (this arm is rare-free, §61) — never score it
# with train_v34_phase0_largectx_1536.yaml.
#
# Cost (measured, v36 arms): ~146 s/epoch on 1xB200 at 1024 steps/epoch → ~2h
# for 50 epochs. Only two arms fit at once (~98 GB each of 183 GB); the third
# is queued behind the first rather than co-located.
#
# Launch:
#   CUDA_DEVICES=<gpu> NPROC_PER_NODE=1 \
#   TORCHRUN_BIN=/home/aibio_3/miniconda3/envs/BagPFN/bin/torchrun \
#   NETRC=/NHNHOME/BASE/kimds/.netrc \
#   scripts/launch_interactive_training.sh v38_no_global configs/train_v38_ridge_ablation_no_global_1536.yaml

seed: 42
ckpt_path:

data: default
data_overrides:
  episode_batch_size: 1
  dataset_kwargs:
    num_cells: [1, 16384]
    num_cells_log_uniform_power: 1.5

model: default

optimizer: default
scheduler: default

trainer: default
trainer_overrides:
  devices: 1
  max_epochs: 50

logger: default
logger_overrides:
  experiment_name: v38_no_global

callbacks: default

model_kwargs:
  training_targets_per_episode: [5, 12]
  ranking_loss_weight: 0.10
  routing_sparsity_weight: 0.0
  routing_balance_weight: 0.0
  # Rare-removed (§61), matching the control.
  meta_enable_rare_evidence: false
  meta_population_token_mode: projected
  meta_enable_global_ridge: false
