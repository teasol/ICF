# Arm 5: v54 architecture rerun, current padding, scalar + one population.
#
# 왜 다시 올리나. 2e-5는 **학습이 안 되던 구조**에서 고른 값이다. inducing-point
# 인코더(v50~v52)에서는 LR이 낮을수록 나았다:
#   5e-4  발산 (train_ce까지 상승)
#   1e-4  SEAL 0.6047
#   2e-5  SEAL 0.6619
# 그 단조성은 "학습할수록 표현이 나빠진다"는 뜻이었고, 원인은 기술자가 256개
# 숫자로 좁았던 것이다(세포끼리 attend도 못 했다).
#
# v53에서 구조를 고치자(세포 간 self-attention + 기술자 16,384차원) 궤적이
# 뒤집혔다 — train_ce/val_ce/val_auroc가 **전부 단조 개선**한다:
#   ep0 0.6925/0.6505/0.7650  ->  ep6 0.6142/0.5954/0.7885
# ep6에서 이미 v50~v52의 역대 최고(0.7841)를 넘었다.
#
# 그러면 LR 상한도 달라졌을 수 있다. 이 arm은 그것만 잰다: 구조가 바뀐 뒤에도
# LR이 낮을수록 좋은가, 아니면 뒤집혔는가.
#
# ⚠️ v53과 유일한 차이가 LR이어야 판정이 성립한다. 다른 것은 건드리지 않았다.
#
seed: 42
ckpt_path:

data: default
data_overrides:
  episode_batch_size: 1
  dataset_kwargs:
    num_cells: [1, 16384]
    num_cells_log_uniform_power: 1.5
    response_dim: 1
    responsive_population_count: 1
    label_rule: single

model: set_transformer_ridge

optimizer: adamw_1e4
scheduler: default

trainer: default
trainer_overrides:
  devices: 1
  max_epochs: 50

logger: default
logger_overrides:
  experiment_name: v60_scalar_1pop_current_v54

callbacks: default

model_kwargs:
  training_targets_per_episode: [5, 12]
  ranking_loss_weight: 0.10
  routing_sparsity_weight: 0.0
  routing_balance_weight: 0.0
  nonfinite_gradient_policy: zero
  # 대역폭 고정: a*K = 0.85*pi
