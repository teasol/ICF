# v76 Medium control for the v77 population-token residual experiment.
#
# Keep the current scalar / one-population / single-label / orthogonal-linear
# task structure, cardinality distribution, optimizer, and training budget.
# Only restore the historical Medium signal/noise/rarity axes so the control
# and residual arms are compared on a meaningfully harder task.
base_config: train_v76_cv_learnable_p_dd_ct_mlp_1pop_linear_1536.yaml

data_overrides:
  dataset_kwargs:
    class_separation: [0.5, 1.4]
    response_score_scale: 0.80
    response_score_min_margin: 0.08
    response_mixture_effect_scale: 1.40
    response_state_effect_scale: [0.45, 1.00]
    response_covariance_effect_scale: [0.30, 0.80]
    rare_response_probability: 0.15
    rare_response_fraction: [0.02, 0.08]
    observation_noise: 0.01

logger_overrides:
  experiment_name: v76_medium_cv_learnable_p_dd_ct_mlp_1pop_linear
