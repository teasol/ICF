# ARCHIVED 2026-09-02 — self-contained reproduction record.
#
# The active baseline is v120 (docs/current_architecture.md): a 0-parameter,
# fully deterministic training-free arm. Nothing in this file reaches a margin
# any more — it is kept only as the reproduction record of the learned-parameter
# lineage (v77-v105). Already self-contained, so no `base_config` can break
# after this move (agent_handoff SS7.3).
#
# Original location: configs/train_v99_p2_norm_1536_1gpu.yaml
# Active entry point now: configs/train_v98_p1_reverse_1536_1gpu.yaml, and only
# as a checkpoint SHELL — v106+ overrides the projection and the head, so no
# learned value from it reaches the margin (docs SS152).
#
# v99: P2 ALONE -- normalize_output true -> false.
#
# Question (docs SS126): P2 has never been run on its own. It appeared in exactly
# one arm, v97 (P1+P2+P3), which was the worst result of the screening at -0.0178.
# Subtracting v96 (P1+P3, -0.0065) blamed P2 for -0.0113 of that, but both are
# SINGLE seeds, so the difference carries 1.1 sigma and establishes nothing --
# and SS125-1 has just been written into the prohibitions table precisely because
# a 1-seed sign flipped under 4 seeds (v94: +0.0022 -> -0.0043).
#
# The gap it targets (SS123-5): synthetic cells are EXACTLY unit norm because
# `normalize_output` L2-normalizes them -- measured 1.0000 +/- 0.0000 -- while
# real UNI2 tiles run 16.33 +/- 2.56 over a 9.8 to 30.4 range. Synthetic carries
# no per-cell magnitude information at all. Turning normalization off moves the
# norm sd from 0.00 to 0.84, which closes about a third of that gap; closing it
# fully would need a knob that renormalizes to a sampled norm, which does not
# exist yet. So this arm tests a PARTIAL fix, and a null here does not clear the
# norm axis on its own.
#
# Note the model is insulated from raw scale: `BaseAggregator._context_pool_stats`
# standardizes every cell by the per-feature mean/std of the episode's context
# cells. What survives that is the per-cell magnitude VARIATION, which is exactly
# what this knob restores -- and it is also why real features can be fed in raw
# from h5 with no normalization anywhere in the eval path.
#
# Nothing else moves: spectrum and bag coherence are untouched (r90 28, cosine
# +0.105 vs the baseline's +0.107).
#
# Judged per docs SS107-3 (gate) and SS118 (final call is the user's): 1-GPU,
# SEED 42/43/44/45, epoch 49, seed-paired against v83_linear_head_seed4{2..5}_ep49
# (mean 0.6880). Report per SS118-3.
seed: 42
ckpt_path: null
