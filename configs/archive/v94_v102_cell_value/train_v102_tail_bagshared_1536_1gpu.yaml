# ARCHIVED 2026-09-02 — self-contained reproduction record.
#
# The active baseline is v120 (docs/current_architecture.md): a 0-parameter,
# fully deterministic training-free arm. Nothing in this file reaches a margin
# any more — it is kept only as the reproduction record of the learned-parameter
# lineage (v77-v105). Already self-contained, so no `base_config` can break
# after this move (agent_handoff SS7.3).
#
# Original location: configs/train_v102_tail_bagshared_1536_1gpu.yaml
# Active entry point now: configs/train_v98_p1_reverse_1536_1gpu.yaml, and only
# as a checkpoint SHELL — v106+ overrides the projection and the head, so no
# learned value from it reaches the margin (docs SS152).
#
# v102: the first episode that matches real UNI2 on BOTH spectrum and coherence.
#
# What was blocked (docs SS129). SS123 measured three ways synthetic cells differ
# from real UNI2 tiles. Coherence was closed and did not pay (v94). The norm gap
# was only ever closed a third of the way and that hurt (v99). The spectral gap
# was the one that stayed blocked, in two stages:
#
#   stage 1  no existing knob could produce the SHAPE. `manifold_mode: orthogonal`
#            is an isometric embedding of an isotropic latent, so the spectrum
#            inside the subspace is FLAT and participation moves together with
#            r90. Their ratio never got below 0.66 against a real 0.11-0.16:
#              orthogonal l32   31.2/28   = 1.11      nonlinear l512  299.2/454 = 0.66
#              orthogonal l512 411.8/433  = 0.95      real UNI2        50-76/431-542
#
#   stage 2  `spectral_tail_*` fixed the shape (participation 67.2, r90 422,
#            ratio 0.16) but COLLAPSED coherence -- cosine +0.013, ICC 1.4%
#            against +0.351 and 31.6% -- and `donor_shift_scale` could not pull it
#            back, saturating at +0.130 even at 8.0.
#
# Why stage 2 was structural, not a tuning problem: the two mechanisms live in
# different spaces. The tail is iid per cell across the 1536-dim OUTPUT space;
# donor_shift is a per-bag offset inside the 32-dim LATENT, applied before the
# manifold map. A 32-dim lever cannot balance 1536-dim variation. In real slides
# there are not two mechanisms -- one high-dimensional slide-specific offset
# (staining, scanner, patient) shared by every tile produces the coherence AND
# feeds the tail at once.
#
# The fix: `spectral_tail_bag_fraction` splits the tail's own variance into a
# bag-shared part and a per-cell part drawn from the SAME covariance, with
# sqrt(1-f)/sqrt(f) weights so the per-cell marginal variance is unchanged. One
# mechanism, both statistics, exactly as in real data.
#
# Fitted with scripts/diagnose_synthetic_vs_real.py before any GPU time:
#
#                        participation      r90      cosine     ICC
#   v83 baseline              31.2           28      +0.104    10.8%
#   v95 tail alone (f=0)      67.2          422      +0.013     1.4%
#   v94 donor_shift 0.75      28.9           27      +0.337    34.3%
#   v102 (f=0.4)              53.9          293      +0.354    34.3%
#   real UNI2                50-76      431-542      +0.351    31.6%
#
# Three of four targets land. r90 at 293 is still short of 431-542, but that is
# a 10x improvement on the baseline's 28 and sits 2.3x above the model's
# `covariance_sketch_dim` of 128, which was the mechanism SS123-3 named. The
# residual gap is finite-sample, not a design limit: the bag-shared component has
# only as many independent draws as there are bags, so the EMPIRICAL spectrum
# contracts even though the population covariance does not.
#
# v102 differs from v95 by EXACTLY ONE KNOB (bag_fraction 0.0 -> 0.4), so the
# comparison isolates the mechanism rather than a bundle -- the rule SS127-2 was
# written after v100 bundled three knobs and became uninterpretable.
#
# ⚠️ Prior: closing these gaps has never paid. Coherence was closed exactly in
# v94 and returned -0.0043. This arm tests whether closing them TOGETHER, through
# one mechanism, differs from closing either alone -- not a bet that it will.
#
# Model, head and P are byte-identical to v83 (architecture_version=54,
# trainable 196,621). Data knobs only.
#
# Judged per docs SS107-3 (gate) and SS118 (final call is the user's): 1-GPU,
# SEED 42/43/44/45, epoch 49, seed-paired against v83_linear_head_seed4{2..5}_ep49
# (mean 0.6880). Report per SS118-3.
