base_config: ../v30/train_v30_cardinality_poolz_l2.yaml

# v33 Phase 0 arm C = v30 + legacy five-task mix + B2b (per-bag cardinality).
#
# Factor separation (proposal v33 §3): arm C vs arm A (committed v30) isolates
# the per-bag mixed-n regime. Under B2b every bag draws its own cell count
# n_b ~ LogUniform[1,1024] within the episode, so one episode spans the full
# bag-size regime exactly as real data do. The v30 architecture is UNCHANGED.
#
# Ragged (list-of-bags) episodes are not stackable, so episode_batch_size stays
# at 1 and shape_group_size is disabled. Match Arm B by optimizer-step budget:
# Arm B uses 4096 episodes / batch 8 = 512 updates per epoch, therefore Arm C
# uses 512 episodes / batch 1 = the same 512 updates. The previous 4096-episode
# setting accidentally made Arm C 8x longer (~20 h) without being a fair
# factor control.
#
# Gates (Phase 0): legacy overall regression <= 0.01 (paired CI including zero)
# vs committed v30, and B2b must cut full-vs-subsample margin drift >= 20% vs B2.
#
# Precision: bf16-mixed to match v30 baseline and Arm B exactly (factor
# separation requires identical precision). The ragged B2b path was already
# validated under bf16-mixed in the Phase 0 smoke run.
data_overrides:
  episode_batch_size: 1
  dataset_kwargs:
    episodes_per_epoch: 512
    per_bag_cardinality: true
    shape_group_size: 1

logger:
  name: csv
  save_dir: logs
  experiment_name: v33_phase0_armC_b2b

trainer:
  max_epochs: 50
  precision: bf16-mixed
