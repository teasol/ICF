# Architecture v21 Large Context Signal-Aware Pre-training Config
base_config: train_v21_medium.yaml
optimizer: adamw_learnability_5e4

data_overrides:
  episode_batch_size: 32
  # num_workers/pin_memory are forced to 0/false by DataInterface whenever
  # dataset_kwargs.generation_device == "cuda" (inherited from configs/data/medium.yaml) --
  # multi-process workers would each hold their own CUDA context and add
  # nothing over the in-process CudaPrefetchDataLoader below. Left here only
  # to document intent for CPU-generating configs that copy this file.
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  cuda_prefetch: true
  retrieval_k: 24
  use_signal_aware_retrieval: true
  dataset_kwargs:
    response_task_probabilities: [0.20, 0.20, 0.20, 0.20, 0.20]
    return_task_metadata: true

model_kwargs:
  ranking_loss_weight: 0.10
  routing_sparsity_weight: 0.0
  routing_balance_weight: 0.0
  retrieval_k: 24

model_overrides:
  covariance_relation:
    enabled: true
    mode: learned_head
    granularity: subspace
    subspace_rank: 1
    subspace_whiten: true
    subspace_shrinkage: 0.25
    diagnostic_only: false
    residual_scale: 0.50
    eps: 1.0e-6

trainer:
  max_epochs: 20
