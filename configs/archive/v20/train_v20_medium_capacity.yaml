base_config: train_v20_medium.yaml
model_kwargs:
  aggregator_num_slots: 24
  meta_hidden_dim: 512
  meta_num_heads: 8
  meta_num_set_layers: 3
  meta_relation_hidden_dim: 512
  meta_ridge_dim: 128
model_overrides:
  covariance_relation:
    enabled: true
    mode: learned_head
    granularity: subspace
    subspace_rank: 2
    subspace_whiten: true
    subspace_shrinkage: 0.1
    diagnostic_only: false
    residual_scale: 0.50
    eps: 1.0e-6
