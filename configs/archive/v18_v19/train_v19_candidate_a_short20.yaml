base_config: train_v19_medium.yaml
trainer:
  max_epochs: 20
model_overrides:
  covariance_relation:
    enabled: true
    mode: gated_distance
    granularity: subspace
    subspace_rank: 1
    subspace_whiten: true
    subspace_shrinkage: 0.1
    diagnostic_only: false
    residual_scale: 0.50
    eps: 1.0e-6
