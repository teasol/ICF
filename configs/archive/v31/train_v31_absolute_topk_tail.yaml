base_config: train_v30_cardinality_poolz_l2.yaml

# =============================================================================
# v31 CANDIDATE BASELINE (2026-08-04)
# =============================================================================
# v31 = v30 (residual bottleneck bag proj + poolz_l2 + log-uniform cardinality)
#       + Exponential Multi-Scale Top-K Tail Tokens (`aggregator_absolute_tail_ks: [1, 4, 8, 16]`)
#       + B4 Any-Positive Sparse Meta-Training (`any_positive_sparse` task).
#
# Target: Resolve n > 34 large-bag performance degradation (0.698 -> >= 0.850)
# by extracting exponentially spaced multi-scale tail tokens (1, 4, 8, 16)
# to cover both single-cell needles and 15% sub-population clusters.
# =============================================================================

model_overrides:
  bag_representation: poolz_l2
  aggregator_absolute_tail_ks: [1, 4, 8, 16]

data_overrides:
  dataset_kwargs:
    num_cells: [1, 1024]
    num_cells_log_uniform: true
    response_task_probabilities: [0.18, 0.18, 0.18, 0.18, 0.18, 0.10] # any_positive_sparse added

logger:
  name: csv
  save_dir: logs
  experiment_name: v31_absolute_topk_tail

trainer:
  max_epochs: 50
