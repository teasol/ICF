base_config: train_v30_cardinality_poolz_l2.yaml

# =============================================================================
# v31 CCTS 100-Epoch Resume Extension (2026-08-05)
# =============================================================================

model_overrides:
  bag_representation: poolz_l2
  aggregator_ccts_lambdas: [0.25, 1.0, 4.0]
  aggregator_ccts_tau: 0.5

data_overrides:
  dataset_kwargs:
    num_cells: [1, 1024]
    num_cells_log_uniform: true
    response_task_probabilities: [0.18, 0.18, 0.18, 0.18, 0.18, 0.10]

logger:
  name: csv
  save_dir: logs
  experiment_name: v31_ccts_100ep

trainer:
  max_epochs: 100
