base_config: ../v30/train_v30_cardinality_poolz_l2.yaml

# =============================================================================
# v31 CANDIDATE BASELINE: CCTS (2026-08-04)
# =============================================================================
# v31 = v30 (residual bottleneck bag proj + poolz_l2 + log-uniform cardinality)
#       + Cardinality-Calibrated Tail Scan (`aggregator_ccts_lambdas: [0.25, 1.0, 4.0]`)
#       + Counterfactual Sparse Meta-Training (`any_positive_sparse` task).
#
# Target: Resolve n > 34 large-bag degradation by calibrating instance evidence
# against support context empirical nulls and scanning expected false positive budgets.
# =============================================================================

model_overrides:
  bag_representation: poolz_l2
  aggregator_ccts_lambdas: [0.25, 1.0, 4.0]
  aggregator_ccts_tau: 0.5

data_overrides:
  dataset_kwargs:
    num_cells: [1, 1024]
    num_cells_log_uniform: true
    response_task_probabilities: [0.18, 0.18, 0.18, 0.18, 0.18, 0.10] # any_positive_sparse added

logger:
  name: csv
  save_dir: logs
  experiment_name: v31_ccts

trainer:
  max_epochs: 50
