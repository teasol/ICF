# ARCHIVED 2026-09-02 — self-contained reproduction record.
#
# The active baseline is v120 (docs/current_architecture.md): a 0-parameter,
# fully deterministic training-free arm. Nothing in this file reaches a margin
# any more — it is kept only as the reproduction record of the learned-parameter
# lineage (v77-v105). Already self-contained, so no `base_config` can break
# after this move (agent_handoff SS7.3).
#
# Original location: configs/train_v92_big_bags_1536_1gpu.yaml
# Active entry point now: configs/train_v98_p1_reverse_1536_1gpu.yaml, and only
# as a checkpoint SHELL — v106+ overrides the projection and the head, so no
# learned value from it reaches the margin (docs SS152).
#
# v92: v83 with the episode shape pushed the OTHER way -- fewer, much bigger bags.
#
# Question (docs SS119-4, user direction): v89 and v91 together isolated the two
# axes, and only one of them moved anything.
#
#   v89 (bag x3 AND cell /3)  = -0.0048
#   v91 (cell /3 alone)       = -0.0068
#   -> bag axis = v89 - v91   = +0.0020   (noise; the bag axis is closed)
#
# So the cell axis is the live lever and its sign is known: cutting cells to a
# third costs -0.0068, which v91's config header predicted BEFORE it ran, from
# the measured gap between training bags (mean 2,724 cells, cap 4,096) and real
# slide tile counts (median: ccrcc 4,988 / luad 5,215 / brca 7,736 /
# bc_therapy 2,674; p75 up to 13,149). v92 runs that lever the other way.
#
# Since the bag axis is worth ~nothing, bags pay for the cells. Exactly the
# inverse of v89, same 3x symmetry:
#
#   num_bags           [60, 100]   -> [20, 33]        (/3)
#   num_cells          [256, 8192] -> [768, 24576]    (x3)
#   per_bag_max_cells  4096        -> 12288           (x3)
#
# Budget stays neutral: simulating the log-uniform draw gives E[cells/bag]
# 2,722 -> 8,189 and E[total cells/episode] 217,779 -> 217,009 (-0.4%). The new
# cap of 12,288 reaches the p75 of real slides instead of sitting below their
# median, so this is the first arm whose bags are the size of real ones.
#
# THIRD CAP, found the hard way: the dense training collator carried a
# hard-coded `SYNTHETIC_PADDING_MAX_CELLS = 4096` that subsamples every bag back
# down before padding. It is independent of BOTH knobs below, it had never bound
# because no arm ever asked for a bag over 4,096, and it fails SILENTLY -- the
# first build of this config trained on `(1, 26, 4096, 1536)` episodes at half
# the intended cell budget with no error and a plausible loss curve. It is now
# configurable as `data.padding_max_cells` (default still 4096, so no existing
# arm moves) and pinned by tests/test_padding_max_cells.py.
#
# MODEL KNOB, and it is load-bearing: `max_cells` 8192 -> 12288. It is a
# subsample ceiling in `_subsample_cells`, not a parameter (trainable stays
# 196,621, architecture_version stays 54). It has never mattered before because
# the DATA cap (4,096) was always the binding one. At per_bag_max_cells 12,288 it
# would become binding and would silently throw away a third of every large bag
# -- the arm would then be measuring nothing. It is raised deliberately.
#
# CAVEAT -- the bag axis is being extrapolated outside where it was measured.
# "Bag axis ~ 0" was established going UP ([60,100] -> [180,300]). v92 goes DOWN
# to [20, 33], which is outside that range and NOT symmetric a priori: fewer bags
# means the context ridge (CV) fits its descriptors from fewer points, so small
# contexts could hurt for reasons that had no chance to show up in v89. If v92
# comes back negative, that is a candidate explanation and must be ruled out
# before concluding anything about the cell axis. The clean-but-expensive
# alternative -- hold bags at [60,100] and take 3x the budget (~3.3 h/seed
# against this arm's ~65 min) -- is the fallback if that ambiguity bites.
#
# Sanity floor: `ModelInterface._sample_query_index` needs num_bags >= min_targets
# + num_classes = 5 + 2 = 7. At num_bags 20 there is ample margin.
#
# Judged per docs SS107-3 (gate) and SS118 (final call is the user's): 1-GPU,
# SEED 42/43/44/45, epoch 49, seed-paired against v83_linear_head_seed4{2..5}_ep49
# (mean 0.6880). Report per SS118-3: what the arm tests, then all ten tasks beside
# baseline, then macro delta + t.
seed: 42
ckpt_path: null
data:
