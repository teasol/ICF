# ARCHIVED 2026-09-02 — self-contained reproduction record.
#
# The active baseline is v120 (docs/current_architecture.md): a 0-parameter,
# fully deterministic training-free arm. Nothing in this file reaches a margin
# any more — it is kept only as the reproduction record of the learned-parameter
# lineage (v77-v105). Already self-contained, so no `base_config` can break
# after this move (agent_handoff SS7.3).
#
# Original location: configs/train_v89_episode_shape_1536_1gpu.yaml
# Active entry point now: configs/train_v98_p1_reverse_1536_1gpu.yaml, and only
# as a checkpoint SHELL — v106+ overrides the projection and the head, so no
# learned value from it reaches the margin (docs SS152).
#
# v89: v83 baseline with the EPISODE SHAPE re-matched to the real eval regime.
#
# Question (docs SS115): the training generator has never modeled the shape of a
# real SEAL evaluation episode. Measured, 2026-08-14:
#
#   axis            training (v83)        real eval (50-fold, measured)
#   context bags    60 - 100              90 (brca) / 133 (bc_therapy) /
#                                         197 (ccrcc) / 261 (luad)
#   class ratio     0.500 +/- 0.055       0.178 - 0.780  (every task >= 1.7 sigma out)
#
# `scripts/test_pathobench.py` defaults to `--context-mode all`, which returns
# `list(train_ids)` -- the whole train fold at its natural class ratio, with no
# balancing (the balancing `sample` mode exists but is deprecated and unused).
# So 6 of the 10 tasks run at 2-2.6x the largest bag count ever seen in training.
#
# This arm moves ONE of those two axes: bag count. `num_bags` 3x, per-bag cell
# counts 1/3, so the per-episode cell budget is unchanged -- E[total cells per
# episode] 217,936 -> 218,167 (+0.1%, measured by simulating the log-uniform
# draw). Model, head and P are byte-identical to v83 (architecture_version=54,
# trainable 196,621); only the data shape moves, same as v86/v87.
#
# CAVEAT -- two axes move together, by construction. Holding the budget fixed
# means the cell axis pays for the bag axis, and the cell axis was ALREADY short:
# real slide tile counts (median) are ccrcc 4,988 / luad 5,215 / brca 7,736 /
# bc_therapy 2,674, against a training mean of 2,724 cells per bag (cap 4,096).
# After this change that mean is 909 (cap 1,365), i.e. 3-8x below the real
# medians instead of ~2x. A null result therefore does NOT isolate "bag count
# does not matter" -- it could be the two effects cancelling. A positive result
# is unambiguous; a negative one needs the budget-tripled variant to separate.
#
# The class-ratio axis is NOT touched here -- `_sample_labels` has no class-prior
# knob at all (`balanced: false` is Bernoulli(0.5), deliberately built so context
# label counts carry no information). That needs a generator change and is a
# separate arm.
#
# Judged per docs SS107-3: 1-GPU, SEED 42/43/44/45, epoch 49, seed-paired
# against v83_linear_head_seed4{2..5}_ep49 (mean 0.6880).
seed: 42
