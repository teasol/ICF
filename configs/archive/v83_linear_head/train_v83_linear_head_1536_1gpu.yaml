  - 0.01529195
  ridge_lambda: 1.0
  ridge_logit_scale: 2.0
  num_classes: 2
  dd_shrinkage: 0.25
  dd_eps: 1.0e-06
  ct_num_tokens: 16
  ct_cells_per_bag: 64
  ct_temperature: 0.5
  ct_eps: 1.0e-06
  ct_head_hidden_dim: 32
  ct_head_hidden_dims: []
optimizer:
  optimizer_src: torch.optim.AdamW
  optimizer_kwargs:
    lr: 0.0001
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.01
scheduler:
