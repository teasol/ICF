# ARCHIVED 2026-09-02 — self-contained reproduction record.
#
# The active baseline is v120 (docs/current_architecture.md): a 0-parameter,
# fully deterministic training-free arm. Nothing in this file reaches a margin
# any more — it is kept only as the reproduction record of the learned-parameter
# lineage (v77-v105). Already self-contained, so no `base_config` can break
# after this move (agent_handoff SS7.3).
#
# Original location: configs/train_v105_mlpproj_h512_1536_1gpu.yaml
# Active entry point now: configs/train_v98_p1_reverse_1536_1gpu.yaml, and only
# as a checkpoint SHELL — v106+ overrides the projection and the head, so no
# learned value from it reaches the margin (docs SS152).
#
# v105-h512: the cell projection becomes an MLP. Sweep point hidden=512.
#
# Question (docs SS134, user direction). v98's projection is a single learnable
# matrix P (1536x128) orthonormalised by QR every forward, so the model learns a
# 128-dimensional SUBSPACE rather than an arbitrary map. v104 showed that
# learning it matters -- freezing P costs -0.0126 (t=-3.59), one of the very few
# results clearing both the gate and the 0.0121 detection floor. This arm asks
# whether a nonlinear projection does better.
#
#   projected = act(centered @ W1) @ QR(W2).Q        # 1536 -> 512 -> 128
#
# The output projection is STILL QR-orthonormalised. That is deliberate: a plain
# MLP leaves the output scale free, and covariance magnitudes feed `ridge_lambda`
# and `covariance_slopes` (= 0.85*pi/K at K=128), both calibrated to the current
# scale. SS70 measured that the gains come from that sketch geometry, not from
# capacity (K fixed +0.0271, extra dimensions +0.0043), so letting scale drift
# would confound this arm with a recalibration. With `identity` activation the
# composition is linear and reduces to the v98 model -- pinned by
# tests/test_mlp_projection.py, which also pins the orthonormality and both
# gradient paths.
#
#   trainable   v98 196,621  ->  hidden 128: 213,005 | 256: 425,997 | 512: 851,981
#   arch        54 -> 58   (NOT strict-load compatible with v98; train from scratch)
#
# ⚠️⚠️ PRIOR EVIDENCE IS AGAINST THIS DIRECTION, and it is specific. Lineage B
# (Encoder+Ridge) was REJECTED in SS79 after a much stronger version was tried
# and the known design error corrected: cell-cell attention at 16,384 dimensions
# moved synthetic val_auroc 0.784 -> 0.849 while SEAL fell 0.6619 -> 0.6526, and
# the arm best on synthetic (v54) was worst on SEAL at 0.6219. The recorded
# conclusion was "the problem is generalisation, not capacity or structure".
# This arm is narrower -- covariance sketch kept, output still orthonormal -- but
# it moves the same way, so the failure to watch for is synthetic-improves /
# SEAL-drops. **Report synthetic val_ce next to SEAL macro.** A drop in SEAL with
# val_ce improving is the SS79 pattern repeating, not a new finding.
#
# ⚠️ Judged against v98's OWN seeds 42-45 (0.6907 / 0.6950 / 0.6802 / 0.6946),
# never against the 8-seed mean (SS131-1). Four seeds resolve only >= 0.0121
# (SS131-2); inside that band the verdict is "not measurable".
#
# Judged per docs SS107-3 (gate) and SS118 (final call is the user's). Report per
# SS118-3.
