# v91: v83 baseline with ONLY the cell axis cut to a third.
#
# Question (docs SS115-7): v89 moved bag count 3x AND cells 1/3 together to hold
# the per-episode budget fixed, and came back MIDPOINT -- macro -0.0048, t=-1.39,
# 1/4 seeds. That is unresolved, and worse, it cannot be interpreted: "the bag
# axis does nothing" and "a positive bag effect cancelled a negative cell effect"
# predict the same number. The caveat was written into v89's config header and
# SS115-4 BEFORE it ran, so this is a planned follow-up, not a rescue.
#
# v91 isolates the half that v89 could not: `num_bags` stays at v83's [60, 100]
# and only the cell counts drop to a third. Subtracting gives the bag axis back:
#
#   v91 delta ~= -0.005  ->  the cell cut explains v89 entirely, bag axis ~ 0
#   v91 delta ~=  0      ->  the bag axis really is worth -0.005
#
# Not a clean factorial -- interaction is possible and two arms cannot rule it
# out. It does collapse most of the current ambiguity for the least compute of
# any arm so far.
#
# Cost: the per-episode cell budget is a THIRD of v83's (E[total cells/episode]
# 217,936 -> 72,722), so this is the cheapest arm in the project, roughly
# 22 min/seed against v83's 65 and v89's 100.
#
# Direction of the cell axis, for reading the result: real slide tile counts
# (median) are ccrcc 4,988 / luad 5,215 / brca 7,736 / bc_therapy 2,674, against
# a v83 training mean of 2,724 cells per bag (cap 4,096). The cell axis was
# ALREADY short of real data, so cutting it further is expected to hurt, not
# help. A v91 delta near zero would itself be informative -- it would say the
# model is insensitive to bag size over this range, which would also weaken the
# premise behind SS115's whole cell-axis argument.
#
# Model, head and P are byte-identical to v83 (architecture_version=54,
# trainable 196,621). Only three data knobs move, and they are exactly v89's
# cell-side knobs:
#
#   num_cells          [256, 8192] -> [85, 2731]     (v89 uses these)
#   per_bag_max_cells  4096        -> 1365           (v89 uses this)
#   num_bags           [60, 100]   -> UNCHANGED      (v89 moves this, v91 does not)
#
# Judged per docs SS107-3: 1-GPU, SEED 42/43/44/45, epoch 49, seed-paired
# against v83_linear_head_seed4{2..5}_ep49 (mean 0.6880).
#
# WARNING on reading task-level numbers: SS115-7 measured that with 10 tasks and
# df=3, P(|t| >= 2.5) ~ 0.088 per task, so ~0.9 tasks clear the judgment gate by
# chance alone. v89 produced exactly two such tasks and both are noise. Judge on
# macro; record per-task as direction only.
