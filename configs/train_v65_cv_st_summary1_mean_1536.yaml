# v65: CV + compact ST with one learned summary token and one mean token.
# ST is 512 summary + 512 transformed-cell masked mean; fixed CV remains K128.
#
# One class-balanced closed-form ridge reads a 9,280-d concatenated descriptor:
# ST 1,024 + CV 8,256.
# The two blocks use independent context-only center/RMS normalization. CV-2 is absent.
# DDP4, 100 epochs, with permanent checkpoints every 10 epochs plus best-3/last.
seed: 42
ckpt_path:

data: default
data_overrides:
  episode_batch_size: 1
  dataset_kwargs:
    num_cells: [256, 8192]
    num_cells_log_uniform_power: 2.0
    response_dim: 1
    responsive_population_count: 1
    label_rule: single
    manifold_mode: orthogonal
    per_bag_max_cells: 4096

model: legacy_covariance_set_transformer_ridge

optimizer: adamw_1e4
scheduler: default

trainer: default
trainer_overrides:
  devices: 4
  strategy: ddp_find_unused_parameters_false
  max_epochs: 100

logger: default
logger_overrides:
  experiment_name: v65_cv_st_summary1_mean

callbacks:
  checkpoint:
    enabled: true
    dirpath: checkpoints
    filename: "{epoch:03d}-{val_ce_loss:.4f}"
    monitor: val_ce_loss
    mode: min
    save_top_k: 3
    save_last: true
  periodic_checkpoint:
    enabled: true
    dirpath: checkpoints
    filename: "periodic-{epoch:03d}-{val_ce_loss:.4f}"
    every_n_epochs: 10
  lr_monitor:
    enabled: true
    logging_interval: epoch

model_overrides:
  center_cells: true
  num_summary_tokens: 1
  include_mean_token: true

model_kwargs:
  training_targets_per_episode: [5, 12]
  ranking_loss_weight: 0.10
  routing_sparsity_weight: 0.0
  routing_balance_weight: 0.0
  nonfinite_gradient_policy: zero
  # Dimensions: ST (1 summary + 1 mean) x512=1024; CV K128=8256.
