# v45 — CV-2 head를 차원별(paired_head)로, subspace_rank 4 (docs SS74)
#
# 무엇을 고치나. 기존 learned_head는 MLP에 넣기 전에
# `.square().mean(dim=-1)`로 rank 축을 평균내 없앤다. rank를 올려도 head가 보는
# 것은 **항상 스칼라 4개**다. rank가 출력에 전혀 영향이 없다는 뜻은 아니다 —
# 고르는 고유벡터가 달라지니 값은 바뀐다 — 그러나 head는 **어느 차원이 신호를
# 갖고 있었는지 알 수 없고**, 판별력 있는 방향이 무의미한 방향들과 평균돼
# 희석된다. v42의 결과(rank 2 +0.0004, rank 4 −0.0008)가 그 모양이다.
#
# paired_head는 head를 차원마다 돌리고 그 뒤에 pooling한다. 강한 차원 하나가
# 평균에 묻히지 않는다.
#
# 덤으로 고치는 것: **label-swap 등변성**. 클래스 이름만 바꾸면 margin의 부호만
# 뒤집혀야 하는데 learned_head는 실측 4.4e-2 어긋난다(CV-1 ridge는 정확히 0.0).
# 기존 test_label_swap_is_equivariant가 이걸 못 잡은 이유는 그 테스트가
# covariance_relation을 끈 모델을 만들기 때문이다.
#   paired_head:  margin = mean_r [ h(e0_r, e1_r, sep_r) − h(e1_r, e0_r, sep_r) ]
# 라벨을 바꾸면 두 호출이 맞바뀌어 부호가 뒤집힌다. 학습이 아니라 구성으로 보장된다.
#
# head는 차원 간 공유되므로 파라미터 shape이 subspace_rank와 무관하다 —
# rank 스윕이 ckpt 호환을 깨지 않고, 고유벡터 축의 순서·부호가 임의라는 점과도
# 맞는다(pooling이 그 축에 대해 치환 불변).
#
# ⚠️ 출력단 bias는 h(a,b,s) − h(b,a,s)에서 상쇄되어 gradient를 못 받는다.
#    반대칭성의 대가이며 정상이다(tests/test_paired_relation_head.py가 고정).
#
# 비교 기준: v41_K128 (learned_head, rank 1) — SEAL 10개 0.6940.
# ⚠️ margin_activation은 tanh 유지 — identity는 온도와 무관하게 −0.017이었다
#    (v43 T→34.0 0.6770, v44 T→2.84 0.6763, 10개 task 전부 셋째 자리까지 일치).
# 판정은 SEAL 10개 macro 평균으로(SS71-4).
#
seed: 42
ckpt_path:

data: default
data_overrides:
  episode_batch_size: 1
  dataset_kwargs:
    num_cells: [1, 16384]
    num_cells_log_uniform_power: 1.5

model: default
model_overrides:
  covariance_relation:
    mode: paired_head
    subspace_rank: 4

optimizer: default
scheduler: default

trainer: default
trainer_overrides:
  devices: 1
  max_epochs: 50

logger: default
logger_overrides:
  experiment_name: v45_paired_rank4

callbacks: default

model_kwargs:
  training_targets_per_episode: [5, 12]
  ranking_loss_weight: 0.10
  routing_sparsity_weight: 0.0
  routing_balance_weight: 0.0
  nonfinite_gradient_policy: zero
  aggregator_covariance_sketch_dim: 128
  # CV-2도 K를 따라간다 (기존 32 고정 -> K)
  aggregator_covariance_matrix_dim: null
  # 대역폭 고정: a*K = 0.85*pi
  aggregator_covariance_slopes: [0.02086214, 0.01529195]
