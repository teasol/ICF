# v53 — 진짜 Transformer Encoder + summary token 32개 (docs SS75 재설계)
#
# v50~v52는 세포끼리 attend하지 않는 inducing-point 인코더였다. 그 선택의 근거는
# "전면 self-attention은 감당 불가"였는데 **틀렸다**. 실측(bag 내부, 256차원, flash):
#   bag  85 x  2,836셀 (중앙값)   1.7 ms   0.46 GiB
#   bag 100 x 16,384셀 (최악)    55.0 ms   3.13 GiB
# 쌍의 개수는 크지만 flash 커널이 attention 행렬을 만들지 않아 메모리는 O(N)이다.
# 쌍 개수를 곧바로 실행 불가로 번역한 것이 오류였다.
#
# 그 오판은 두 가지를 망쳤다. 세포들이 서로를 못 보게 했고, bag 기술자를 256개
# 숫자로 좁혔다(sketch는 8,256). v51/v52의 패배(0.6047/0.6619)를 "학습 신호가
# 표현을 개선하지 못한다"로 읽었지만, 표현할 수 있는 것 자체가 좁았을 가능성을
# 배제하지 못한다. 이 arm이 그걸 가른다.
#
# 바뀐 것:
#   세포끼리 self-attention (2층)
#   summary token 32개를 CLS처럼 앞에 붙임 — 모든 세포와, 서로와 attend
#   ridge 입력 = 32 x 512 flatten = 16,384차원 (sketch 8,256의 2배)
#   세포 상한 8,192
#
# attention 백엔드는 cuDNN. B200(sm_100)에서 flash 백엔드보다 2.7배 빠르다
# (6.5ms vs 17.7ms, 85x2,836, fwd+bwd, 512차원). FlashAttention-3는 쓰지 않는다 —
# Hopper(sm_90) 타깃이고 이 장비는 sm_100이다.
#
# 실측 비용 (fwd+bwd+step): 중앙값 45.7 ms / 최악 195 ms, peak 44 GiB.
# CV-only(8.5 ms)보다 5배 비싸다. epoch 약 60~70초 예상.
#
# LR은 2e-5 — v50~v52에서 낮을수록 좋았다(5e-4 발산 < 1e-4 0.6047 < 2e-5 0.6619).
# ⚠️ 그 단조성이 여기서도 유지되면 문제는 구조가 아니라 학습 신호다.
#
# 비교 기준: v41_K128 (CV-only) SEAL 10개 0.6940 / SEAL ABMIL 0.727 /
#            v52 (좁은 기술자) 0.6619.
#
seed: 42
ckpt_path:

data: default
data_overrides:
  episode_batch_size: 1
  dataset_kwargs:
    num_cells: [1, 16384]
    num_cells_log_uniform_power: 1.5

model: set_transformer_ridge

optimizer: adamw_2e5
scheduler: default

trainer: default
trainer_overrides:
  devices: 1
  max_epochs: 50

logger: default
logger_overrides:
  experiment_name: v53_encoder_summary32

callbacks: default

model_kwargs:
  training_targets_per_episode: [5, 12]
  ranking_loss_weight: 0.10
  routing_sparsity_weight: 0.0
  routing_balance_weight: 0.0
  nonfinite_gradient_policy: zero
  # 대역폭 고정: a*K = 0.85*pi
