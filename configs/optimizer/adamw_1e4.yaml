# AdamW @ lr=0.0001. default(5e-4)는 학습 파라미터 229개짜리 CV-only에
# 맞춰진 값이라, 2.26M 파라미터가 ridge solve를 통과해 학습하는
# set-transformer 계보(SS75)에는 과하다 — v50에서 train_ce까지 함께
# 올랐다(0.5693 -> 0.6165, warmup 구간과 정확히 겹침).
# Default optimizer = v34-1536 (PathoBench reporting model, 2026-08-07).
optimizer_src: torch.optim.AdamW
optimizer_kwargs:
  lr: 0.0001
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01
