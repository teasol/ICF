# v81 fixed-P, single-GPU layout for a 4-seed batch on GPUs 0-3.
#
# Only the trainer layout changes from train_v81_hard_fixed_p_1536.yaml, and it
# matches train_v80_hard_shallow_mlp_1536_1gpu.yaml so the two 4-seed batches are
# directly comparable.
#
# ⚠️ Do NOT compare these seeds against the DDP4 v77 number 0.6880. One GPU gives
# 1024 steps/epoch at effective batch 1; DDP4 gives each rank 1024/4 = 256 steps
# and averages 4 gradients. The matched control is v77 run through this same
# layout, seed for seed -- see train_v77_hard_orthogonal_1536_1gpu.yaml.
#
# Seeds come from the launcher's SEED env var. The training dataset keeps
# seed: null (episode_dataset: true) while val/test stay pinned at 50042/60042,
# so every seed is validated and tested on identical episodes.
base_config: train_v81_hard_fixed_p_1536.yaml

trainer_overrides:
  devices: 1
  strategy: auto
