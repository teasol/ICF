# v100: NUISANCE MINIMIZATION -- the direct test of docs SS126's hypothesis.
#
# Question. Five arms now line up under one statement: adding nuisance variation
# to the synthetic training distribution HURTS, and removing it helps. Every one
# of them agrees in sign:
#
#   v98  donor_shift_scale 0.35 -> 0.15   bag-level nuisance REMOVED    +0.0021 (4/4)
#   v94  donor_shift_scale 0.35 -> 0.75   bag-level nuisance added      -0.0043 (1/4)
#   v90  class_prior [0.15,0.85]          episode-level prevalence      -0.0053 (4/4 neg)
#   v95  spectral_tail_scale 2.5          cell-level, 1536-dim          -0.0086 (1 seed)
#   v99  normalize_output false           per-cell magnitude            -0.0094 (t=-2.32)
#
# That reframes SS115 and SS123 without special pleading. Both diagnoses were
# correct that synthetic cells are UNLIKE real UNI2 tiles, and every prescription
# derived from them was a way of ADDING nuisance to close the gap -- which is
# precisely the wrong direction. The P1 axis is monotone across three measured
# points (0.15 / 0.35 / 0.75 -> +0.0021 / 0 / -0.0043), not a local optimum.
#
# v100 pushes that direction as far as the knobs allow, in one arm, because the
# hypothesis predicts it should beat v98's +0.0021 and clear the SS107-3 gate:
#
#   donor_shift_scale            0.35  -> 0.0   (rigid per-bag latent offset)
#   donor_component_shift_scale  0.12  -> 0.0   (per-bag x component offset)
#   observation_noise            0.005 -> 0.0   (isotropic measurement noise)
#
# Deliberately NOT touched: donor_mixture_logit_scale,
# donor_shared_component_logit_scale, shared_component_base_logit_scale. Those
# shape each bag's COMPOSITION, which is what the abundance signal is built from
# -- zeroing them would remove task structure, not nuisance, and a gain would be
# uninterpretable.
#
# CAVEAT, stated up front: `observation_noise` is the one component with contrary
# evidence. v86 DOUBLED it (0.005 -> 0.01) and got +0.0004 (t=0.71, 3/4), a mild
# positive where the hypothesis predicts a negative. That is inside noise, but if
# v100 comes back null the decomposition to run first is donor-knobs-only versus
# noise-only, rather than concluding the hypothesis is dead.
#
# Prediction being tested (falsifiable): macro delta > +0.0021 and 4/4 seeds.
# A null or negative result falsifies "less nuisance is monotonically better".
#
# Model, head and P are byte-identical to v83 (architecture_version=54,
# trainable 196,621). Data knobs only.
#
# Judged per docs SS107-3 (gate) and SS118 (final call is the user's): 1-GPU,
# SEED 42/43/44/45, epoch 49, seed-paired against v83_linear_head_seed4{2..5}_ep49
# (mean 0.6880). Report per SS118-3.
