name: exp1_ct_template
description: "Template for Exp 1: CT (Cell Tokenizer) Refinement"
version: "exp1"

basis:
  sketch_dim: 256
  ridge_lambda: 1.0
  ridge_scale: 2.0

branches:
  cv:
    weight: 1.0
    blocks: offdiag

  bm:
    weight: 1.0
    dim: 32
    lambda: 1.0

  bd:
    weight: 1.0
    dim: 256
    metric: entropy
    readout: ordered_typicality
    lambda: 1.0
    separation_floor: 1.0
    eps: 1e-6

  qa:
    weight: 1.0
    dim: 32
    quantiles: [0.05, 0.10, 0.90, 0.95]
    lambda: 1.0

  ds:
    weight: 1.0
    dim: 32
    tokens: 256
    temperature: 1.0
    lambda: 1.0

  ct:
    weight: 1.0
    pca_dim: 32
    tokens: 256
    tokenizer: hierarchical_2means  # hierarchical_2means | kmeans_plusplus | fps | hdbscan | dbscan
    readout: ridge                  # ridge | prototype | extreme
    cells_fraction: null            # e.g. 0.125 or null for full cells
    cells_min: 1
    cells_scale: own
    sampling: even
    distance_kernel: gemm
    tree_reduction: segment
    temperature: 0.5
    eps: 1e-6

  dd:
    weight: 0.0

aggregation:
  method: trimmed_mean
