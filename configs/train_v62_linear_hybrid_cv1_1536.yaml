# v62: orthogonal linear manifold + 16-token Set Transformer + K128 CV-1.
#
# One class-balanced closed-form ridge reads a 16,448-d concatenated descriptor:
# summary 16x512=8,192 and CV-1 upper-triangle covariance 128x129/2=8,256.
# The two blocks use independent context-only center/RMS normalization. CV-2 is absent.
# DDP4, 100 epochs, with permanent checkpoints every 10 epochs plus best-3/last.
seed: 42
ckpt_path:

data: default
data_overrides:
  episode_batch_size: 1
  dataset_kwargs:
    num_cells: [1, 16384]
    num_cells_log_uniform_power: 1.5
    response_dim: 1
    responsive_population_count: 1
    label_rule: single
    manifold_mode: orthogonal

model: covariance_set_transformer_ridge

optimizer: adamw_1e4
scheduler: default

trainer: default
trainer_overrides:
  devices: 4
  strategy: ddp_find_unused_parameters_false
  max_epochs: 100

logger: default
logger_overrides:
  experiment_name: v62_linear16_cv1_k128

callbacks:
  checkpoint:
    enabled: true
    dirpath: checkpoints
    filename: "{epoch:03d}-{val_ce_loss:.4f}"
    monitor: val_ce_loss
    mode: min
    save_top_k: 3
    save_last: true
  periodic_checkpoint:
    enabled: true
    dirpath: checkpoints
    filename: "periodic-{epoch:03d}-{val_ce_loss:.4f}"
    every_n_epochs: 10
  lr_monitor:
    enabled: true
    logging_interval: epoch

model_kwargs:
  training_targets_per_episode: [5, 12]
  ranking_loss_weight: 0.10
  routing_sparsity_weight: 0.0
  routing_balance_weight: 0.0
  nonfinite_gradient_policy: zero
  # Hybrid dimensions: summary 16x512=8192; covariance K128 triangle=8256.
