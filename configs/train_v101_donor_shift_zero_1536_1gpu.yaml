# v101: donor_shift_scale -> 0.0 ALONE. Unbundles v100.
#
# Question (docs SS127). v100 zeroed three knobs at once -- donor_shift_scale,
# donor_component_shift_scale and observation_noise -- to test SS126-3's
# "less nuisance is monotonically better" as hard as possible. It came back
# -0.0076 (t=-3.59, 0/4), which crosses the gate in the REJECTION direction and
# falsifies the monotone form. But bundling three knobs made the strongest test
# also the least interpretable one: nothing in v100 says WHICH knob did the
# damage.
#
# Two readings survive, and they disagree about where the optimum is:
#
#   inverted-U on donor_shift    peak near 0.15, and 0.0 overshoots
#       0.00 (v100) -0.0076 | 0.15 (v98) +0.0021 | 0.35 (v83) 0 | 0.75 (v94) -0.0043
#
#   observation_noise did it     donor_shift is monotone after all, and v100 fell
#       because switching measurement noise off made the SYNTHETIC task much
#       easier -- val_ce went 0.152 -> 0.099 -- which is this repo's single
#       most-repeated failure mode (SS1's prohibition table, first row: v37 had
#       better val_ce and lost 0.0068 on the 50-fold). It would also retro-explain
#       v86, which RAISED observation_noise 0.005 -> 0.01 for +0.0004: noise is
#       acting as a regularizer, not as harmful nuisance.
#
# v101 changes ONE knob: donor_shift_scale 0.35 -> 0.0, with observation_noise
# left at 0.005 and donor_component_shift_scale left at 0.12. That is v100 minus
# the two confounds.
#
#   v101 negative  -> the inverted-U is real and v98's 0.15 is the optimum;
#                     v98 becomes the arm to confirm with more seeds
#   v101 ~zero/positive -> v100's loss was observation_noise, the donor axis is
#                     monotone downward, and the next point to try is below 0.15
#
# Statistics move as intended and only on the targeted axis (measured, 40 bags):
#
#   donor_shift_scale   0.00 (v101)  0.15 (v98)  0.35 (v83)  0.75 (v94)  real
#   within-bag cosine   ~+0.002      +0.027      +0.107      +0.340      +0.351
#   ICC                 ~0.2%        2.7%        10.8%       34.3%       31.6%
#   r90                 28           28          28          27          431-542
#
# NOTE this arm sits at the SAME cosine/ICC as v100 (both have no donor shift at
# all) but keeps the noise and component-shift terms, so comparing v101 against
# v100 isolates those two directly.
#
# Model, head and P are byte-identical to v83 (architecture_version=54,
# trainable 196,621). One data knob.
#
# Judged per docs SS107-3 (gate) and SS118 (final call is the user's): 1-GPU,
# SEED 42/43/44/45, epoch 49, seed-paired against v83_linear_head_seed4{2..5}_ep49
# (mean 0.6880). Report per SS118-3.
