# v82: v77 with the difficulty knob alone moved to ClassSep Medium [0.5,1.4].
#
# Why (SS105-3): the ClassSep sweep, once every arm was scored at epoch 49, is
# 0.6735 / 0.6881 / 0.6854 / 0.6880 / 0.6843 for baseline / Medium / Mild / Hard /
# Very-hard. Medium ties Hard at +0.0001 [-0.0022, +0.0024] and the four
# difficulty arms span 0.0038 -- under the 0.0051 macro seed std. Every one of
# those numbers is a single seed, so "Hard [0.2,0.8] is the optimal difficulty"
# has never been measured; it was an arbitrary pick inside the noise. This arm is
# Medium at 4 seeds so Hard vs Medium can finally be judged.
#
# Data-only change: class_separation [0.2,0.8] -> [0.5,1.4] in the shared
# dataset_kwargs block, so train/val/test all move together. Model, optimizer,
# schedule, and epoch budget are v77's untouched -- trainable stays 197,057 and
# architecture_version stays 54.
#
# ⚠️ val_ce is NOT comparable to v77's 0.1717: an easier ClassSep lowers the loss
# on its own. Judgment is SEAL macro only, epoch 49, fold-paired vs a v77 arm in
# the same device layout.
#
# Provenance: this reproduces the single-seed arm v76_axis_classsep_medium
# (0.6882 at epoch 48, 0.6881 at epoch 49), whose config differs from
# train_v76_classsep_mild_1536.yaml in class_separation alone. That arm is the
# one SS91 mis-recorded as 0.6823, which was the Very-hard value duplicated.
base_config: train_v77_hard_orthogonal_1536.yaml

data_overrides:
  dataset_kwargs:
    class_separation:
    - 0.5
    - 1.4

logger_overrides:
  experiment_name: v82_medium_classsep
