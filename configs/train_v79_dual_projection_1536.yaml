# v79: learnable-P CV and fixed-P CV as separate branches, DD back on the fixed P.
#
# v77 shares one learnable P between CV and DD, so the subspace is shaped for CV's
# readout and DD merely inherits it. v78 tried to arbitrate that with a gradient
# weight and the sweep came back monotone the wrong way:
#   weight 0    -> 0.6873 (v77)
#   weight 0.02 -> 0.6869   Delta -0.0004 [-0.0021, +0.0013]  (indistinguishable)
#   weight 1.0  -> 0.6826   Delta -0.0047 [-0.0082, -0.0013]  (CI excludes 0)
# DD does move P, and the direction it pushes is harmful. So stop sharing rather
# than arbitrate.
#
# Four branches, 4 features each, 16 -> 32 -> 1:
#   CV(learnable P)  the only path whose gradient reaches P
#   CV(fixed P)      the v41_K128 basis (0.6940, still the historical best) kept as
#                    its own evidence block instead of being replaced by the learned one
#   DD(fixed P)      no longer rides whatever subspace CV settled on
#   CT               unchanged, projection-free
#
# The rank-1 dispersion direction is still never differentiated (`_dd_direction`):
# eigh backward carries 1/(lambda_i - lambda_j), the shrinkage leaves those gaps
# untouched, and the argmax selection is discontinuous. `train_dd_projection` is
# rejected outright here -- DD reads a buffer, so the flag would be a silent no-op.
#
# Tensor graph changes (second covariance block + 16-wide head), so
# architecture_version is 56 and this does NOT strict-load a v77 checkpoint.
# trainable: P 196,608 + head 577 = 197,185.
# Judgment is fold-paired delta + bootstrap CI against the v77 control (docs SS99).
base_config: train_v77_hard_orthogonal_1536.yaml

model_overrides:
  model_src: src.models.set_transformer_ridge.DualProjectionCVDDCTMLPModel
  kwargs:
    dual_head_hidden_dim: 32

logger_overrides:
  experiment_name: v79_dual_projection
