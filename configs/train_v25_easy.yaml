base_config: train_v25_medium_typed_bag.yaml

# Easy tier for v25 (T5-A). Same rationale and parameter choices as
# train_v24_easy.yaml -- see that file for the full Medium/Hard/Easy table.
# Chains from train_v25_medium_typed_bag.yaml so the typed_bag_preserving_branch
# architecture is identical to the confirmed v25 candidate; only the data
# distribution changes.
data_overrides:
  episode_batch_size: 8
  dataset_kwargs:
    shape_group_size: 8
    class_separation: [1.2, 2.2]
    donor_shift_scale: 0.15
    donor_component_shift_scale: 0.06
    observation_noise: 0.002
    rare_response_probability: 0.05
    rare_response_fraction: [0.05, 0.15]
    response_mixture_effect_scale: 1.80
    response_state_effect_scale: [0.90, 1.60]
    response_covariance_effect_scale: [0.70, 1.30]

logger:
  name: csv
  save_dir: logs
  experiment_name: v25_easy

trainer:
  max_epochs: 50
