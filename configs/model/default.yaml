model_src: src.models.baseline.BaseModel

# CV-only model (docs SS73). Five of the six evidence branches were deleted from
# the source, so the keys that configured them are gone too -- passing one now
# raises TypeError instead of being silently ignored. Git holds the full-branch
# model and its configs at `8caa96c`.
input_dim: 1536

# --- aggregator: centring + the fixed projection -----------------------------
bag_centered_representation: true
bag_representation: poolz_l2
global_summary: centered_spread
# K. sketch length = K(K+1)/2. Dimension IS effective, but only with the
# bandwidth held fixed (SS71-5): 9/10 tasks, +0.0127 going 64 -> 128.
aggregator_covariance_sketch_dim: 64
# What CV-2 sees. `null` ties it to K.
aggregator_covariance_matrix_dim: 32
# [a, b] frequency slopes. `null` = historical (0.019, 0.011). Set
# a = 0.85*pi/K to keep the used bandwidth constant across a K sweep --
# otherwise changing K changes the bandwidth too and hides the dimension effect.
aggregator_covariance_slopes: null
aggregator_covariance_mode: correlation
aggregator_covariance_shrinkage: 0.1

# --- CV-1: closed-form dual ridge --------------------------------------------
# Only `log_lambda` and `log_scale` are learned; the coefficients are re-solved
# per episode. SS66: removing this collapses training (reproduced twice).
meta_enable_covariance_ridge: true
meta_covariance_ridge_logit_scale: 2.0
meta_covariance_residual_scale: 0.25

# --- CV-2: subspace -> prototype -> MLP --------------------------------------
covariance_relation:
  enabled: true
  mode: learned_head
  granularity: subspace
  # tanh(기본, 역사적) | identity. tanh는 learned_head margin에서 **에피소드의 40%**가
  # 포화해(|tanh| > 0.9999, 국소 기울기 ~2e-4) head가 나머지에서만 배운다 — 전면 차단은
  # 아니다(실측: grad != 0 파라미터 229개). identity는 그 천장을 없앤다.
  margin_activation: tanh
  # ⚠️ rank를 올려도 파라미터 shape은 불변이고 SEAL 10개 평균도 안 움직인다
  # (rank2 +0.0004, rank4 -0.0008). [7]의 mean이 rank 축을 없애 MLP 입력이 항상 4개다.
  subspace_rank: 1
  subspace_whiten: true
  subspace_shrinkage: 0.25
  diagnostic_only: false
  residual_scale: 0.5
  eps: 1.0e-06

num_classes: 2
