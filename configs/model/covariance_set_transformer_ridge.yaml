model_src: src.models.set_transformer_ridge.CovarianceSetTransformerRidgeModel

# Hybrid: 16-token learned descriptor + K128 CV-1 covariance -> one ridge.
# CV-2 is deliberately absent. Both blocks are normalized independently.
input_dim: 1536

token_dim: 512
num_heads: 8
num_layers: 2
feedforward_dim: 1024

# CLS 유사 summary token. 세포 앞에 붙어 모든 세포와, 그리고 서로와 attend한다.
# Summary block: 16x512 = 8,192. Covariance block: 128x129/2 = 8,256.
# Concatenated descriptor: 16,448 dimensions.
num_summary_tokens: 16

# bag당 세포 상한. attention은 살아남은 세포 수에 대해 이차이므로 이게 비용을
# 결정한다. 실측(2층, fwd+bwd): 중앙값 2,836셀 45.7ms / 8,192셀 193.6ms.
# 상한은 크기 분포의 꼬리에만 걸린다.
max_cells: 8192
dropout: 0.0

covariance_sketch_dim: 128
covariance_slopes: [0.02086214, 0.01529195]

ridge_lambda: 1.0
ridge_logit_scale: 2.0
num_classes: 2
