model_src: src.models.set_transformer_ridge.STCVLPRidgeModel

# ST + canonical CV (fixed K128 covariance + raw bag mean) + learnable-P LP.
# All four blocks are normalized independently before one ridge.
input_dim: 1536

token_dim: 512
num_heads: 8
num_layers: 2
feedforward_dim: 1024

# CLS 유사 summary token. 세포 앞에 붙어 모든 세포와, 그리고 서로와 attend한다.
# ST 8,192 + covariance 8,256 + raw mean 1,536 + LP 8,256 = 26,240.
num_summary_tokens: 16

# bag당 세포 상한. attention은 살아남은 세포 수에 대해 이차이므로 이게 비용을
# 결정한다. 실측(2층, fwd+bwd): 중앙값 2,836셀 45.7ms / 8,192셀 193.6ms.
# 상한은 크기 분포의 꼬리에만 걸린다.
max_cells: 8192
dropout: 0.0
center_cells: true

covariance_sketch_dim: 128
covariance_slopes: [0.02086214, 0.01529195]

ridge_lambda: 1.0
ridge_logit_scale: 2.0
num_classes: 2
