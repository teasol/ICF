model_src: src.models.set_transformer_ridge.SetTransformerRidgeModel

# Transformer encoder + summary token + closed-form ridge (docs SS75).
# baseline.py와 별개 모델이라 aggregator_*/covariance_* 손잡이는 없다.
input_dim: 1536

token_dim: 512
num_heads: 8
num_layers: 2
feedforward_dim: 1024

# CLS 유사 summary token. 세포 앞에 붙어 모든 세포와, 그리고 서로와 attend한다.
# ridge가 보는 기술자는 이 32개를 flatten한 32x512 = 16,384차원이다
# (CV-only의 sketch는 8,256차원).
num_summary_tokens: 32

# bag당 세포 상한. attention은 살아남은 세포 수에 대해 이차이므로 이게 비용을
# 결정한다. 실측(2층, fwd+bwd): 중앙값 2,836셀 45.7ms / 8,192셀 193.6ms.
# 상한은 크기 분포의 꼬리에만 걸린다.
max_cells: 8192
dropout: 0.0

ridge_lambda: 1.0
ridge_logit_scale: 2.0
num_classes: 2
