    dirpath: checkpoints
    filename: periodic-{epoch:03d}-{val_ce_loss:.4f}
    every_n_epochs: 10
  lr_monitor:
    enabled: true
    logging_interval: epoch
model_kwargs:
  training_targets_per_episode:
  - 5
  - 12
  ranking_loss_weight: 0.1
  routing_sparsity_weight: 0.0
  routing_balance_weight: 0.0
  nonfinite_gradient_policy: zero
