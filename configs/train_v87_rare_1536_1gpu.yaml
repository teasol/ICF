    warmup_start_factor: 0.1
    plateau_start_epoch: 5
    step_epoch_interval: 1
    plateau_check_interval: 1
    mode: min
    factor: 0.5
    patience: 10
    threshold: 1.0e-05
    threshold_mode: rel
    cooldown: 5
    min_lr: 1.0e-06
  monitor: val_ce_loss
  interval: epoch
  frequency: 1
trainer:
  max_epochs: 50
  precision: bf16-mixed
  devices: 1
  strategy: auto
logger:
  name: csv
  save_dir: logs
  experiment_name: v87_rare
callbacks:
