max_epochs: 1000
accelerator: gpu
# Must match torchrun's WORLD_SIZE for Lightning's TorchElastic environment.
devices: 5
strategy: ddp_find_unused_parameters_false
# bf16-mixed enforced 2026-08-08 (agent_handoff SS3.4): fp16 coefficients
# overflow the covariance-sketch inverse / ridge solves to NaN. Was 16-mixed.
precision: bf16-mixed
log_every_n_steps: 50
check_val_every_n_epoch: 1
num_sanity_val_steps: 0
gradient_clip_val: 1.0
