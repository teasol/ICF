# v78: v77 Hard orthogonal with the DD quadratic-form gradient path open.
#
# v77 learns P only through the CV ridge, yet DD reads the covariance that same P
# produces -- the subspace is optimized for one consumer and inherited by the
# other. This arm lets DD shape P too. The rank-1 dispersion direction stays
# outside autograd (see `_dd_direction`: both eigh backwards carry
# 1/(lambda_i - lambda_j), the shrinkage leaves those gaps untouched, and the
# argmax selection is discontinuous); gradient reaches P only through the
# quadratic form log(f^T C_b f) with f held constant.
#
# Adds no parameters and changes no shape, so trainable stays 197,057 and
# checkpoints remain strict-load compatible with v77 in both directions.
# Judgment is fold-paired delta + bootstrap CI against the v77 control
# (docs SS99), not a point-estimate macro difference.
base_config: train_v77_hard_orthogonal_1536.yaml

#
# dd_projection_gradient_weight balances the two paths. Measured at 1536-d/K=128
# over 6 episodes, the unweighted DD contribution to P's gradient is 52x the CV
# contribution (range 21..103) and nearly orthogonal to it (cos -0.07), so
# weight 1.0 would replace CV's signal rather than add to it -- and a loss would
# then be unreadable, exactly the SS66 trap of not being able to separate "the
# hypothesis is wrong" from "the mechanism never engaged". 0.02 ~ 1/52 equalizes
# the two on the median episode; it cannot equalize every episode, since the
# ratio itself varies 5x.
model_overrides:
  kwargs:
    train_dd_projection: true
    dd_projection_gradient_weight: 0.02

logger_overrides:
  experiment_name: v78_dd_projection
